[package]
name = "piulink-wire"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "android.rs"
crate-type = ["staticlib"]

[dependencies]
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
cbc = "0.1.2"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes"] }

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"
