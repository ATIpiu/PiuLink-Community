[package]
name = "piulink-nvenc-rate"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "abi.rs"

[dependencies]
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
cbc = "0.1.2"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes"] }
piulink-stream-rate = { path = "../.." }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_Audio", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D11", "Win32_Graphics_Gdi", "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11"] }
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Threading"] }
