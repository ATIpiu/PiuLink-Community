[package]
name = "dxgi-info"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[dependencies]
windows = { version = "=0.58.0", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
