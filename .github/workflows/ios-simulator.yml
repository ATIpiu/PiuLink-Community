name: Test iOS Simulator
on:
  workflow_dispatch:
  push:
    branches: [main, codex/ios-download, codex/ios-simulator-validation]
    paths:
      - 'apps/ios-client/**'
      - 'packages/direct-tunnel/**'
      - '.github/workflows/ios-simulator.yml'
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.6'
          cache-dependency-path: packages/direct-tunnel/go.sum
      - name: Cache simulator application across UI test revisions
        id: sim-app
        uses: actions/cache@v4
        with:
          path: ~/piulink-simulator-app.zip
          key: ios-sim-macos15-v1-${{ hashFiles('apps/ios-client/*.py', 'apps/ios-client/*.patch', 'apps/ios-client/*.m', 'apps/ios-client/*.h', 'apps/ios-client/*.png', 'packages/direct-tunnel/**') }}
      - name: Prepare pinned PiuLink sources
        if: steps.sim-app.outputs.cache-hit != 'true'
        run: python3 apps/ios-client/prepare.py "$RUNNER_TEMP/iphone"
      - name: Boot simulator and verify startup
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for k,ds in json.load(sys.stdin)["devices"].items() if ".iOS-" in k for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          if [[ ! -f "$HOME/piulink-simulator-app.zip" ]]; then
            cd "$RUNNER_TEMP/iphone"
            xcodebuild -quiet -project Moonlight.xcodeproj -scheme Moonlight -configuration Debug -destination "id=$device" -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build
            app=("$RUNNER_TEMP"/derived/Build/Products/Debug-iphonesimulator/*.app)
            ditto -c -k --keepParent "${app[0]}" "$HOME/piulink-simulator-app.zip"
          fi
          mkdir -p "$RUNNER_TEMP/installed"
          ditto -x -k "$HOME/piulink-simulator-app.zip" "$RUNNER_TEMP/installed"
          xcrun simctl install "$device" "$RUNNER_TEMP"/installed/*.app
          xcrun simctl launch "$device" labs.atipiu.piulink.ios
          sleep 8
          xcrun simctl spawn "$device" launchctl list | awk '/labs[.]atipiu[.]piulink[.]ios/ && $1 ~ /^[0-9]+$/ {alive=1} END{exit !alive}'
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/startup.png"
      - name: Exercise native controls with XCTest
        working-directory: apps/ios-client/simulator-tests
        run: |
          set -euo pipefail
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          device=$(xcrun simctl list devices booted -j | python3 -c 'import sys,json; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["state"]=="Booted"))')
          xcodebuild -quiet test -scheme Checks -skip-testing:Checks/ClientChecks/testPairingAndApplicationLibrary -destination "id=$device" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/Controls.xcresult"
      - name: Pair with an isolated GameStream host
        if: success() || failure()
        working-directory: apps/ios-client/simulator-tests
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices booted -j | python3 -c 'import sys,json; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["state"]=="Booted"))')
          bash with-peer.sh xcodebuild -quiet test -scheme Checks -only-testing:Checks/ClientChecks/testPairingAndApplicationLibrary -destination "id=$device" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/Checks.xcresult"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-ui
          path: |
            ${{ runner.temp }}/startup.png
            ${{ runner.temp }}/Checks.xcresult/
            ${{ runner.temp }}/Controls.xcresult/





