name: Test iOS Simulator
on:
  workflow_dispatch:
  push:
    branches: [main, codex/ios-download, codex/ios-simulator-validation]
    paths:
      - 'apps/ios-client/**'
      - 'packages/direct-tunnel/**'
      - '.github/workflows/ios-simulator.yml'
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.6'
          cache-dependency-path: packages/direct-tunnel/go.sum
      - name: Prepare pinned PiuLink sources
        run: python3 apps/ios-client/prepare.py "$RUNNER_TEMP/iphone"
      - name: Boot simulator and verify startup
        working-directory: ${{ runner.temp }}/iphone
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for k,ds in json.load(sys.stdin)["devices"].items() if ".iOS-" in k for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcodebuild -quiet -project Moonlight.xcodeproj -scheme Moonlight -configuration Debug -destination "id=$device" -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build
          xcrun simctl install "$device" "$RUNNER_TEMP"/derived/Build/Products/Debug-iphonesimulator/*.app
          xcrun simctl launch "$device" labs.atipiu.piulink.ios
          sleep 8
          xcrun simctl spawn "$device" launchctl list | awk '/labs[.]atipiu[.]piulink[.]ios/ && $1 ~ /^[0-9]+$/ {alive=1} END{exit !alive}'
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/startup.png"
      - name: Test settings, host entry and diagnostics confirmation
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip -o maestro.zip
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  maestro.zip" | shasum -a 256 -c -
          unzip -q maestro.zip
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          if [[ ! -d "$JAVA_HOME" ]]; then export JAVA_HOME=$(/usr/libexec/java_home -v 17); fi
          ./maestro/bin/maestro test --test-output-dir "$RUNNER_TEMP/ui" "$GITHUB_WORKSPACE/apps/ios-client/simulator-flow.yaml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-ui
          path: |
            ${{ runner.temp }}/startup.png
            ${{ runner.temp }}/ui/

