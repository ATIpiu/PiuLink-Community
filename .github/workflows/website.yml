name: Publish PiuLink website

on:
  push:
    branches: [main]
    paths:
      - "sites/downloads/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sites/downloads/package-lock.json
      - run: npm ci
        working-directory: sites/downloads
      - run: npm run build -- --base="/${GITHUB_REPOSITORY#*/}/"
        working-directory: sites/downloads
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sites/downloads/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
